<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors</h1>

    <button onclick="
    pickComputerMove()
        let result = '';
        if (computerGuess === 'Rock'){
            result='Tie'; 
        }
        else if(computerGuess === 'Paper'){
            result='You lose';
        }
        else if(computerGuess === 'Scissor'){
            result='You win';
        }
        alert(`You picked rock , computer picked ${computerGuess}.${result}.`)
        


    ">
        Rock
    </button>

    <button onclick="
        pickComputerMove();
        let result = '';
        if (computerGuess === 'Rock'){
            result='You win'; 
        }
        else if(computerGuess === 'Paper'){
            result='Tie';
        }
        else if(computerGuess === 'Scissor'){
            result='You lose';
        }
        alert(`You picked paper , computer picked ${computerGuess}.${result}.`)
        


    ">Paper</button>

    <button  onclick="
        pickComputerMove();
        let result = '';
        if (computerGuess === 'Rock'){
            result='You lose'; 
        }
        else if(computerGuess === 'Paper'){
            result='You win';
        }
        else if(computerGuess === 'Scissor'){
            result='Tie';
        }
        alert(`You picked Scissor , computer picked ${computerGuess}.${result}.`)
        


    ">Scissor</button>
    <script>
        let computerGuess = '';
        function pickComputerMove(){
             const randomNumber = Math.random();
        let computerGuess = '';

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
            computerGuess = 'Rock';
        }
        else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
            computerGuess = 'Paper';
        }
        else {
            computerGuess = 'Scissor';
        }

        console.log(computerGuess);

        }
    </script>

    
</body>
</html>
